{% extends "base.html" %}
{% block title %}Add Review{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Add Review</h1>
</div>

{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<div class="card" style="max-width:560px;">
  <form method="post" action="/reviews/new">
    <div class="form-group">
      <label for="employee_id">Employee being reviewed *</label>
      <select id="employee_id" name="employee_id" class="form-control" required>
        <option value="">— Select employee —</option>
        {% for e in employees %}
        <option value="{{ e.id }}" {% if e.id == preselected_id %}selected{% endif %}>
          {{ e.name }} · {{ e.designation }} ({{ e.employee_code }})
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="reviewer_id">Reviewer *</label>
      <select id="reviewer_id" name="reviewer_id" class="form-control" required>
        <option value="">— Select reviewer —</option>
        {% for e in employees %}
        <option value="{{ e.id }}">{{ e.name }} · {{ e.designation }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
      <div class="form-group">
        <label for="review_type">Review Type *</label>
        <select id="review_type" name="review_type" class="form-control" required>
          <option value="appreciation">⭐ Appreciation</option>
          <option value="escalation">⚠ Escalation</option>
        </select>
      </div>
      <div class="form-group">
        <label for="review_date">Date *</label>
        <input id="review_date" name="review_date" type="date"
               class="form-control" value="{{ today }}" required />
      </div>
    </div>

    <div class="form-group">
      <label for="notes">Notes *</label>
      <textarea id="notes" name="notes" class="form-control" rows="5"
                placeholder="Describe the reason for this review…" required></textarea>
    </div>

    <div class="d-flex gap-1 mt-2">
      <button type="submit" class="btn btn-primary">Save Review</button>
      <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
