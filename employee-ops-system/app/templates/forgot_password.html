<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset password — CubexO Ops</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-box { width: 360px; }
    .login-box h1 { font-size:1.5rem; margin-bottom:1.5rem; text-align:center; }
    .login-box .brand-icon { display:block; text-align:center; font-size:2.5rem; margin-bottom:.5rem; }
  </style>
</head>
<body>
  <div class="login-box card">
    <span class="brand-icon">⚙</span>
    <h1>Reset password</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/forgot-password">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" class="form-control"
               autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" class="form-control"
               autocomplete="new-password" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" class="form-control"
               autocomplete="new-password" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">
        Update password
      </button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.9rem">
      <a href="/login">Back to login</a>
    </p>
  </div>
</body>
</html>
