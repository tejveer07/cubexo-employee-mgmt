<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — CubexO Ops</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-box { width: 360px; }
    .login-box h1 { font-size:1.5rem; margin-bottom:1.5rem; text-align:center; }
    .login-box .brand-icon { display:block; text-align:center; font-size:2.5rem; margin-bottom:.5rem; }
  </style>
</head>
<body>
  <div class="login-box card">
    <span class="brand-icon">⚙</span>
    <h1>CubexO Ops</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" class="form-control"
               autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control"
               autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
